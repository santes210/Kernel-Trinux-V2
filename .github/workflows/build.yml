name: Trinux — Build & Release

# ============================================================================
# Cuándo se ejecuta:
#   • Push a master o arena/*  → compila + genera ISO + USB de 512 MiB
#   • Pull Request a master    → solo compila (usa ci.yml en su lugar)
#   • Tag v*.*.*               → compila + genera ISO + USB + crea Release
#   • Manual (workflow_dispatch) → igual que tag
#
# Artefactos producidos en cada run:
#   1. mykernel.bin          Kernel ELF Multiboot 32-bit
#   2. trinux.iso            ISO GRUB híbrida BIOS+UEFI
#   3. trinux-usb-512.img    Imagen USB 512 MiB booteable + persistencia
#   4. checksums.txt         SHA-256 de los tres archivos anteriores
# ============================================================================

on:
  push:
    branches:
      - master
      - 'arena/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      usb_size_mb:
        description: 'Tamaño de la imagen USB en MiB'
        required: false
        default: '512'
      create_release:
        description: 'Crear GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  KERNEL_BIN: mykernel.bin
  ISO_FILE:   trinux.iso
  USB_IMG:    trinux-usb-512.img
  USB_SIZE:   ${{ github.event.inputs.usb_size_mb || '512' }}

jobs:

  # ── JOB 1: Compilar y generar artefactos ─────────────────────────────────
  build:
    name: 🔨 Compilar + ISO + USB
    runs-on: ubuntu-22.04

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib \
            nasm \
            binutils \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub2-common \
            xorriso \
            mtools \
            dosfstools \
            file
          echo "── Versiones instaladas ──"
          gcc --version  | head -1
          nasm --version | head -1
          ld  --version  | head -1
          grub-mkrescue --version | head -1
          xorriso --version 2>&1 | head -1

      - name: 🏷️ Calcular versión
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER=$(git describe --tags --long --always 2>/dev/null \
                  || echo "v0.3.0-$(git rev-parse --short HEAD)")
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "🏷️ Versión: ${VER}"
          echo "📅 Fecha  : $(date -u +'%Y-%m-%d %H:%M UTC')"

      - name: ⚙️ Compilar kernel
        run: |
          echo "══════════════════════════════════════════"
          echo "  Compilando Trinux ${{ steps.version.outputs.version }}"
          echo "══════════════════════════════════════════"
          make clean
          make -j$(nproc)
          echo ""
          ls -lh ${{ env.KERNEL_BIN }}
          file ${{ env.KERNEL_BIN }}

      - name: 🔍 Verificar kernel
        run: |
          SIZE=$(stat -c%s ${{ env.KERNEL_BIN }})
          echo "📏 Tamaño: $((SIZE/1024)) KiB"
          [ "$SIZE" -gt 102400 ] || { echo "❌ Kernel demasiado pequeño"; exit 1; }
          echo "✅ OK"

      - name: 💿 Generar ISO GRUB (BIOS + UEFI hybrid)
        run: |
          mkdir -p iso/boot/grub
          cp ${{ env.KERNEL_BIN }} iso/boot/${{ env.KERNEL_BIN }}

          cat > iso/boot/grub/grub.cfg << 'GRUBEOF'
          set timeout=5
          set default=0
          set menu_color_normal=white/black
          set menu_color_highlight=black/light-gray

          menuentry "Trinux — Arranque normal" {
            multiboot /boot/mykernel.bin
            boot
          }

          menuentry "Trinux — Modo single-user (recovery)" {
            multiboot /boot/mykernel.bin single
            boot
          }

          menuentry "Trinux — Shell ring-0 (debug)" {
            multiboot /boot/mykernel.bin oldsh
            boot
          }
          GRUBEOF

          # Reemplazar "Trinux" con "Trinux vX.Y.Z" en las entradas del menú
          sed -i "s/Trinux —/Trinux ${{ steps.version.outputs.version }} —/g" \
            iso/boot/grub/grub.cfg

          grub-mkrescue --output=${{ env.ISO_FILE }} iso 2>&1

          echo "✅ ISO lista:"
          ls -lh ${{ env.ISO_FILE }}
          file ${{ env.ISO_FILE }}

      - name: 🔌 Generar imagen USB de ${{ env.USB_SIZE }} MiB
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  Generando imagen USB de ${{ env.USB_SIZE }} MiB"
          echo ""
          echo "  Estructura de la imagen:"
          echo "  ┌──────────────────────────────────────────────────┐"
          echo "  │  MBR híbrido GRUB (bootea en BIOS y UEFI)       │"
          echo "  │  Kernel Trinux ${{ steps.version.outputs.version }}                       │"
          echo "  ├──────────────────────────────────────────────────┤"
          echo "  │  Zona de persistencia (filesystem del kernel)    │"
          echo "  │  → se graba con 'sync' dentro de Trinux          │"
          echo "  └──────────────────────────────────────────────────┘"
          echo "══════════════════════════════════════════════════════"

          cp ${{ env.ISO_FILE }} ${{ env.USB_IMG }}

          ISO_BYTES=$(stat -c%s ${{ env.ISO_FILE }})
          TARGET_BYTES=$(( ${{ env.USB_SIZE }} * 1024 * 1024 ))

          if [ "$TARGET_BYTES" -gt "$ISO_BYTES" ]; then
            echo "📏 Extendiendo: $((ISO_BYTES/1024/1024)) MiB → ${{ env.USB_SIZE }} MiB"
            truncate -s "${TARGET_BYTES}" ${{ env.USB_IMG }}
          fi

          FINAL=$(stat -c%s ${{ env.USB_IMG }})
          echo "✅ Imagen USB lista: $((FINAL/1024/1024)) MiB"
          ls -lh ${{ env.USB_IMG }}

      - name: 🔐 Checksums SHA-256
        run: |
          sha256sum \
            ${{ env.KERNEL_BIN }} \
            ${{ env.ISO_FILE }} \
            ${{ env.USB_IMG }} \
            | tee checksums.txt

      - name: 📤 Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: trinux-${{ steps.version.outputs.version }}
          retention-days: 30
          compression-level: 6
          path: |
            ${{ env.KERNEL_BIN }}
            ${{ env.ISO_FILE }}
            ${{ env.USB_IMG }}
            checksums.txt

      - name: 📊 Resumen en GitHub Actions
        run: |
          KB=$(( $(stat -c%s ${{ env.KERNEL_BIN }}) / 1024 ))
          IM=$(( $(stat -c%s ${{ env.ISO_FILE }})   / 1024 / 1024 ))
          UM=$(( $(stat -c%s ${{ env.USB_IMG }})    / 1024 / 1024 ))
          cat >> $GITHUB_STEP_SUMMARY << SUMEOF
          ## ✅ Trinux ${{ steps.version.outputs.version }} — Build exitoso

          | Artefacto | Tamaño | Uso |
          |---|---|---|
          | \`${{ env.KERNEL_BIN }}\` | ${KB} KiB | QEMU \`-kernel\` o desarrollo |
          | \`${{ env.ISO_FILE }}\` | ${IM} MiB | CD/DVD, VM, USB (sin persistencia) |
          | \`${{ env.USB_IMG }}\` | ${UM} MiB | **USB real** — booteable + persistencia |

          ### SHA-256
          \`\`\`
          $(cat checksums.txt)
          \`\`\`

          ### Cómo usar en QEMU
          \`\`\`bash
          # Imagen USB (recomendado — tiene persistencia)
          qemu-system-i386 -drive file=trinux-usb-512.img,format=raw,if=ide -m 512M -serial stdio

          # ISO (más simple, sin persistencia)
          qemu-system-i386 -cdrom trinux.iso -m 512M -serial stdio
          \`\`\`

          ### Flashear a USB real
          \`\`\`bash
          # ⚠️ Reemplaza sdX con tu dispositivo — BORRA TODO
          sudo dd if=trinux-usb-512.img of=/dev/sdX bs=4M status=progress conv=fsync
          \`\`\`
          SUMEOF

  # ── JOB 2: Crear GitHub Release (tags o dispatch manual) ─────────────────
  release:
    name: 🚀 GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          pattern: trinux-*
          merge-multiple: true
          path: ./release-files

      - name: 📋 Listar artefactos
        run: ls -lh release-files/

      - name: 🚀 Crear Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: "Trinux ${{ needs.build.outputs.version }}"
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          body: |
            ## Trinux ${{ needs.build.outputs.version }}

            Sistema operativo Unix-like escrito completamente desde cero en C y ensamblador x86.

            ---

            ### 📦 Descargas

            | Archivo | Descripción |
            |---|---|
            | `trinux-usb-512.img` | ⭐ **Imagen USB de 512 MiB** — Flasheable a USB, bootea en BIOS y UEFI, incluye zona de persistencia del filesystem |
            | `trinux.iso` | ISO GRUB híbrida — Arranca en BIOS Legacy, CSM y UEFI |
            | `mykernel.bin` | Kernel ELF Multiboot (para desarrollo / `qemu -kernel`) |
            | `checksums.txt` | Checksums SHA-256 de todos los archivos |

            ---

            ### 🚀 Cómo usar

            #### QEMU — Recomendado para probar
            ```bash
            # Con imagen USB (tiene persistencia — los archivos se guardan entre reinicios)
            qemu-system-i386 \
              -drive file=trinux-usb-512.img,format=raw,if=ide \
              -m 512M -serial stdio

            # Con la ISO (más simple, sin persistencia)
            qemu-system-i386 -cdrom trinux.iso -m 512M -serial stdio

            # Con red (RTL8139 + ping)
            qemu-system-i386 \
              -drive file=trinux-usb-512.img,format=raw,if=ide \
              -nic model=rtl8139 \
              -m 512M -serial stdio

            # Con SMP (múltiples cores)
            qemu-system-i386 \
              -drive file=trinux-usb-512.img,format=raw,if=ide \
              -smp 4 -m 512M -serial stdio
            ```

            #### USB real
            ```bash
            # ⚠️ CUIDADO: reemplaza sdX con tu dispositivo USB — BORRA TODO LO QUE HAY
            sudo dd if=trinux-usb-512.img of=/dev/sdX bs=4M status=progress conv=fsync
            sync
            # Bootea desde la USB (desactivar Secure Boot en UEFI si hace falta)
            ```

            ---

            ### 🔑 Credenciales por defecto
            | Usuario | Contraseña |
            |---|---|
            | `root` | `root` |
            | `user` | `user` |

            > Las contraseñas se almacenan como hashes **SHA-256** en `/etc/shadow`.

            ---

            ### ✨ Qué incluye
            - 🔐 SHA-256 en `/etc/shadow` (nunca texto plano)
            - 🛡️ Validación de punteros en syscalls (`uaccess`)
            - 🧵 Pipes reales en RAM (ring buffer 4 KiB)
            - 🍴 `fork()` con address space independiente
            - 📁 FAT16 lectura **y escritura** completa
            - ⚡ SMP: arranque de APs via LAPIC IPI
            - 🌐 Driver de red RTL8139
            - 🔌 ACPI power management real
            - 📡 Stack ARP + IPv4 + ICMP (`ping` funcional)
            - 🖥️ Double buffering en framebuffer (sin parpadeo)
            - 🏗️ Infraestructura Long Mode 64-bit
            - 📦 Comando `tar` (formato ustar)
            - 🐚 70+ comandos en ring 3 real (CPL=3)
            - 📝 Editor de texto (`edit`/`nano`)
            - ⚙️ Compilador C integrado (`tcc`)

          files: |
            release-files/mykernel.bin
            release-files/trinux.iso
            release-files/trinux-usb-512.img
            release-files/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
